# Elastic Security detection rule — detection-rules repo format
# Technique: T1003.001 OS Credential Dumping: LSASS Memory
# Author: Keith M | Version: 1 | Data: Sysmon EID 10 via Winlogbeat/Elastic Agent
# Convert/import with: python -m detection_rules import-rule <this file>  (or Kibana Upload)

[metadata]
creation_date = "2026/07/24"
updated_date = "2026/07/24"
maturity = "production"
min_stack_version = "8.12.0"

[rule]
author = ["Keith M"]
name = "Credential Access - LSASS Memory Access (T1003.001)"
description = """
Detects handle access to lsass.exe using access masks associated with credential
dumping tools (Mimikatz, procdump, comsvcs MiniDump, nanodump, handlekatz). Based
on Sysmon EventID 10 (ProcessAccess). Tune WerFault.exe and AV/EDR sources per env.
"""
risk_score = 73
severity = "high"
type = "query"
language = "kuery"
index = ["winlogbeat-*", "logs-windows.sysmon_operational-*", "logs-endpoint.events.*"]
from = "now-9m"
interval = "5m"
false_positives = [
    "WerFault.exe crash reporting opens LSASS legitimately.",
    "AV/EDR and backup/DLP agents may access LSASS.",
    "IR/purple-team tooling, including this lab's own validation.",
]
references = [
    "https://attack.mitre.org/techniques/T1003/001/",
]
tags = ["Domain: Endpoint", "OS: Windows", "Tactic: Credential Access", "Technique: T1003.001"]

# ---- PRIMARY QUERY (KQL / kuery) ----
query = '''
event.code:"10" and winlog.event_data.TargetImage:*\\lsass.exe and
winlog.event_data.GrantedAccess:("0x1010" or "0x1410" or "0x1438" or "0x143a" or "0x1FFFFF")
'''

[[rule.threat]]
framework = "MITRE ATT&CK"
[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
[[rule.threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"
[[rule.threat.technique.subtechnique]]
id = "T1003.001"
name = "LSASS Memory"
reference = "https://attack.mitre.org/techniques/T1003/001/"

# =============================================================================
# ALTERNATE QUERY LANGUAGES (same logic — pick per deployment)
# =============================================================================
#
# ---- EQL (better for the process-creation / tooling variant) ----
# process where event.code == "1" and
#   (
#     (process.name : "rundll32.exe" and process.command_line : "*comsvcs*" and
#        process.command_line : ("*MiniDump*", "*#24*")) or
#     (process.name : "procdump*.exe" and process.command_line : "*lsass*") or
#     process.command_line : ("*nanodump*","*handlekatz*","*dumpert*","*pypykatz*","*lsassy*","*sekurlsa*","*mimikatz*")
#   )
#
# ---- ES|QL (ad-hoc hunt / dashboards) ----
# FROM winlogbeat-*, logs-windows.sysmon_operational-*
# | WHERE event.code == "10"
#     AND winlog.event_data.TargetImage LIKE "*\\\\lsass.exe"
#     AND winlog.event_data.GrantedAccess IN ("0x1010","0x1410","0x1438","0x143a","0x1FFFFF")
# | STATS hits = COUNT(*) BY host.name, winlog.event_data.SourceImage, winlog.event_data.GrantedAccess
# | SORT hits DESC
