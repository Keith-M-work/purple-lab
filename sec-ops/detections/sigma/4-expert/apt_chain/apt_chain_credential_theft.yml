title: LSASS Access With Unknown Call Trace
id: 3e6b0c52-1d84-4f37-a099-4c8b2e5f7013
name: apt_chain_credential_theft
status: test
description: Handle opened against lsass.exe where the call trace contains unbacked
  memory (UNKNOWN), typical of injected or reflectively loaded dumping code.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Keith M
date: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    CallTrace|contains: 'UNKNOWN'
  filter_werfault:
    SourceImage|endswith:
      - '\WerFault.exe'
      - '\WerFaultSecure.exe'
  condition: selection and not filter_werfault
falsepositives:
  - EDR and AV products using unbacked memory legitimately
level: high
