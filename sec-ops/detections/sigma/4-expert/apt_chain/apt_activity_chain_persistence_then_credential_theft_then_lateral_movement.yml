title: APT Activity Chain - Persistence Then Credential Theft Then Lateral Movement
id: f6a7b8c9-0123-45ef-6789-7890123456ab
status: experimental
description: |
  Correlates the full intrusion chain on a single host within one hour:
  WMI event-subscription persistence, followed by LSASS credential theft,
  followed by lateral movement using explicit credentials. Any stage alone is
  medium-confidence at best; the ordered sequence is not.

  The masquerading scheduled-task rule (apt_chain_scheduled_task) is a sibling
  standalone detection in this folder, not a stage of this ordered chain -
  temporal_ordered cannot express "WMI OR scheduled task" within one stage. To
  cover the scheduled-task persistence path here, fold both selections into a
  single persistence base rule and reference that instead.
references:
  - https://attack.mitre.org/tactics/TA0003/
  - https://attack.mitre.org/tactics/TA0006/
  - https://attack.mitre.org/tactics/TA0008/
author: Keith M
date: 2026/07/24
tags:
  - attack.persistence
  - attack.credential_access
  - attack.lateral_movement
correlation:
  type: temporal_ordered
  rules:
    - apt_chain_wmi_persistence
    - apt_chain_credential_theft
    - apt_chain_lateral_movement
  group-by:
    - Computer
  timespan: 1h
falsepositives:
  - Administrative activity that happens to touch all three stages within an hour
  - Purple-team exercise runs in this lab
level: critical
