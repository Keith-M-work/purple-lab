title: Password Spray - One Source Against Many Accounts
id: 6f9d3b58-0e42-4a79-c36d-8b1f5d2c9e04
status: test
description: Failed logons against more than 10 distinct accounts from a single
  source IP in 30 minutes - the low-and-slow inverse of brute force, which a
  per-account lockout threshold will not catch.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Keith M
date: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - failed_logon_network
  group-by:
    - IpAddress
  timespan: 30m
  condition:
    gte: 10
    field: TargetUserName
falsepositives:
  - A shared NAT egress IP after a mass password expiry
level: high
