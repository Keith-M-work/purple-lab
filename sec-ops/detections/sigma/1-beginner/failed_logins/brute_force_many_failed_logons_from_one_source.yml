title: Brute Force - Many Failed Logons From One Source
id: 5e8c2a47-9d31-4f68-b25c-7a0e4c1b8d93
status: test
description: More than 10 failed logons from a single source IP within 5 minutes.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Keith M
date: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1110
correlation:
  type: event_count
  rules:
    - failed_logon_network
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - Misconfigured service accounts retrying with stale credentials
  - Vulnerability scanners and this lab's own credential-attack exercises
level: medium
