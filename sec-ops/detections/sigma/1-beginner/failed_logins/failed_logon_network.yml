# =============================================================================
# Brute force detection - T1110
#
# Rewritten 2026-07-24. The previous version used legacy sigmatools aggregation
# syntax (`timeframe:` inside `detection:` plus `condition: selection | count()
# by IpAddress > 10`). pySigma / sigma-cli does not accept that; thresholds are
# now expressed as a separate `event_count` correlation document.
# =============================================================================

title: Failed Logon Attempt
id: b2c3d4e5-6789-01bc-def2-3456789012bc
name: failed_logon_network
status: test
description: A single failed network or remote-interactive logon (EID 4625).
  Low value alone - consumed by the brute-force correlation below.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Keith M
date: 2025/01/20
modified: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType:
      - 3   # Network
      - 10  # RemoteInteractive (RDP)
  filter_machine_accounts:
    TargetUserName|endswith: '$'
  condition: selection and not filter_machine_accounts
fields:
  - TargetUserName
  - IpAddress
  - WorkstationName
  - LogonType
falsepositives:
  - Misconfigured service accounts
  - Users with expired or forgotten passwords
level: informational
