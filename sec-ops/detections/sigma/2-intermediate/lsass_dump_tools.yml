title: LSASS Credential Dumping via Command Line Tooling
id: 8b1f4a92-6c3d-4e77-9a20-5d8e1c7b3f04
status: test
description: |
  Detects LSASS credential dumping driven from the command line - comsvcs.dll
  MiniDump via rundll32, procdump against lsass, and named dumping utilities.
  Split out of lsass_access.yml because these are process_creation (Sysmon EID 1)
  events, whereas handle access is process_access (Sysmon EID 10).
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
author: Keith M
date: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  selection_comsvcs_ordinal:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - '#24'
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  selection_named_tools:
    # Rename-resilient: matches on the command line rather than the image name.
    CommandLine|contains:
      - 'nanodump'
      - 'handlekatz'
      - 'dumpert'
      - 'pypykatz'
      - 'lsassy'
      - 'sekurlsa'
      - 'mimikatz'
  selection_api_dump:
    CommandLine|contains|all:
      - 'lsass'
      - 'MiniDumpWriteDump'
  condition: 1 of selection_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Authorised IR/forensic collection using procdump
  - Purple-team validation runs in this lab
level: high
