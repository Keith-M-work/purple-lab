title: Registry Run Key Persistence
id: d4e5f6a7-8901-23de-f456-5678901234de
status: test
description: |
  Detects values written to autorun registry keys. Uses the registry_set
  category (which implies EventType SetValue) rather than the broader
  registry_event.
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: Keith M
date: 2025/01/20
modified: 2026/07/24
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnceEx'
      - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders\Startup'
      - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Shell'
      - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit'
  filter_trusted_paths:
    Details|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
  filter_user_writable_exception:
    # These sit UNDER the trusted prefixes above but are user-writable, so a
    # naive `startswith: C:\Windows\` filter is an easy bypass. Re-include them.
    Details|contains:
      - 'C:\Windows\Temp\'
      - 'C:\Windows\Tasks\'
      - 'C:\Windows\Tracing\'
      - 'C:\Windows\System32\spool\drivers\color\'
      - 'C:\Windows\System32\Tasks\'
  condition: selection and (not filter_trusted_paths or filter_user_writable_exception)
fields:
  - TargetObject
  - Details
  - Image
  - User
falsepositives:
  - Legitimate software installers writing autorun entries outside Program Files
  - Portable applications configured to start at logon
level: medium
