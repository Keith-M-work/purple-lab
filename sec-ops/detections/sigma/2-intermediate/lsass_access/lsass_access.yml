title: LSASS Memory Handle Access
id: c3d4e5f6-7890-12cd-ef34-4567890123cd
status: test
description: |
  Detects handle access to lsass.exe with access masks associated with credential
  dumping. Based on Sysmon EventID 10 (ProcessAccess). Command-line/tool-based
  LSASS dumping is covered separately by lsass_dump_tools.yml, which uses the
  process_creation logsource — the two cannot share one rule.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_dump_keyword.yml
author: Keith M
date: 2025/01/20
modified: 2026/07/24
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      # Canonical LSASS-dump mask set, identical across the Splunk / Elastic /
      # CrowdStrike siblings for this technique. VM_READ | QUERY_(LIMITED_)INFO
      # combinations used by Mimikatz, procdump, nanodump, handlekatz, pypykatz,
      # comsvcs MiniDump.
      - '0x1010'   # QUERY_LIMITED_INFORMATION | VM_READ  (nanodump, handlekatz)
      - '0x1410'   # classic Mimikatz sekurlsa::logonpasswords
      - '0x1438'   # procdump / MiniDumpWriteDump
      - '0x143a'   # procdump -ma
      - '0x147a'
      - '0x1f0fff' # PROCESS_ALL_ACCESS (pre-Vista value)
      - '0x1f1fff'
      - '0x1fffff' # PROCESS_ALL_ACCESS
  selection_unknown_calltrace:
    TargetImage|endswith: '\lsass.exe'
    CallTrace|contains: 'UNKNOWN'
  filter_werfault:
    SourceImage|endswith:
      - '\WerFault.exe'
      - '\WerFaultSecure.exe'
  filter_system:
    SourceImage|endswith:
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'
  condition: (selection or selection_unknown_calltrace) and not 1 of filter_*
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - CallTrace
falsepositives:
  - Windows Error Reporting (WerFault) dumping a crashing LSASS - filtered above
  - AV/EDR, backup and DLP agents that legitimately open LSASS
  - IR and purple-team tooling, including this lab's own validation runs
level: high
