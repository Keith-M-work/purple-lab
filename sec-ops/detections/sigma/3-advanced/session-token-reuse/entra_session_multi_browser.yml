title: Session Token Used From Multiple Browsers (Entra ID)
id: 4b8d0f32-5c69-4e17-a024-7f3b9d5e1c86
status: experimental
description: |
  One Entra ID session id presented by two or more distinct browsers within an
  hour. A session cookie cannot legitimately move between browsers - there is no
  benign path that produces this. Indicates AiTM phishing, infostealer cookie
  theft or token replay.

  REQUIRES browser-family normalisation upstream (see README.md). Entra's
  DeviceDetail.browser is "Chrome 126.0.0", so without normalising to family a
  routine auto-update reads as a second browser and this rule fires on it. This
  is the dominant false positive.

  MFA does not prevent this: the stolen token is already authenticated. Respond
  by REVOKING THE SESSION, not by resetting the password.
references:
  - https://attack.mitre.org/techniques/T1550/004/
  - https://attack.mitre.org/techniques/T1539/
author: Keith M
date: 2026/07/24
modified: 2026/07/28
tags:
  - attack.defense_evasion
  - attack.credential_access
  - attack.t1550.004
  - attack.t1539
correlation:
  type: value_count
  rules:
    - entra_signin_with_session
  group-by:
    - SessionId
  timespan: 1h
  condition:
    gte: 2
    field: DeviceDetail.browser
falsepositives:
  - Browser auto-update mid-session if DeviceDetail.browser is not normalised to
    family before this rule runs - the dominant FP, see README.md
  - Native application webviews sharing a token with the default browser
level: high
