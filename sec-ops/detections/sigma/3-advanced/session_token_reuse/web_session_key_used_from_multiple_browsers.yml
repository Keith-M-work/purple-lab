title: Web Session Key Used From Multiple Browsers
id: 1c5e7a09-3d36-4f84-b79b-4a0c6e2f8d53
status: experimental
description: One web session key presented by two or more distinct browser
  User-Agents within an hour. Normalise to browser family before this runs, or
  browser auto-update is the dominant FP. Prefer the JA4 variant where TLS
  fingerprints are available - the User-Agent is trivially spoofable and this is
  the weaker of the two.
references:
  - https://attack.mitre.org/techniques/T1550/004/
  - https://attack.mitre.org/techniques/T1539/
author: Keith M
date: 2026/07/24
modified: 2026/07/28
tags:
  - attack.defense_evasion
  - attack.credential_access
  - attack.t1550.004
  - attack.t1539
correlation:
  type: value_count
  rules:
    - webapp_session_request
  group-by:
    - session_key
  timespan: 1h
  condition:
    gte: 2
    field: cs-user-agent
falsepositives:
  - Browser auto-update - dominant FP without family normalisation
level: high
