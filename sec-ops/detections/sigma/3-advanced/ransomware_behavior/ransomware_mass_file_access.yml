title: Mass File Deletion Or Modification
id: 8b3f6d92-4a05-4c17-9e28-0f1d3b5c7e49
name: ransomware_mass_file_access
status: test
description: High-volume DELETE/WRITE access against files by a single process,
  consistent with bulk encryption. Requires a SACL-audited directory (EID 4663).
references:
  - https://attack.mitre.org/techniques/T1486/
author: Keith M
date: 2026/07/24
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectType: 'File'
    AccessList|contains:
      - 'DELETE'
      - 'WriteData'
      - 'AppendData'
  condition: selection
falsepositives:
  - Backup, sync and indexing agents
  - Legitimate bulk file operations
level: low
